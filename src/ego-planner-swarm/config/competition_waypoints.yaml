# ============================================================
# 竞赛航点定义：拱门
# ============================================================
# 坐标系: camera_init (FAST_LIO_ROS2 世界系，无人机上电位置为原点)
# 场地: competition_field.world — 15m(X) × 14m(Y), 原点为中心
#       X: -7.5..7.5, Y: -7..7
# 任务顺序: A → B → C → D
#
# 内部通道:
#   A→B: y=0, x[-3.5, -1.5] (2m 宽)
#   B→C: x=0, y[-2.5, 2.5]
#   C→D: y=0, x[1.5, 3.5]  (2m 宽)
#
# 起飞点: (-5.5, 5.5)
# ============================================================

stages:
  # ── A: 结构化障碍（墙 + 2×φ0.4m 圆柱）────────────────────
  A:
    waypoints:
      - [1.23, 1.03, 1.00]
      - [3.59, 1.08, 1.00]   # 通过缝隙后，A→B 通道入口前方
      - [4.86, 3.01, 1.00]

  # ── B: 任意门（十字墙 + 圆柱 φ0.4m）────────────────────
  B:
    waypoints:
      - [8.23, 3.99, 1.00]
      - [8.61, 7.43, 1.40]   # A→B 通道后，B 区入口   

  # ── C: 茂密森林（9×仿真树 φ0.5m × 高 2m）───────────────
  C:
    waypoints:
      - [5.52, 9.96, 1.40]
      - [3.27, 9.91, 0.30]
      #- [4.71, 10.24, 0.40]  
  # ── D: 稳定自由飞（圆环 φ1m）─────────────────────────
  D:
    waypoints:
    - [1.68, 10.19, 0.30]
    - [-1.29, 9.78, 0.50]
      # - [2.12,  10.23, 0.40]
      # - [-0.12, 13.26, 1.00]

# ── 全局默认值 ──────────────────────────────────────────────
defaults:
  takeoff_height: 1.0     # 起飞高度 (m)
  complete_dist: 1.0      # 航点到达判定半径 (m)
  speed: 0.5     # 巡航速度 (m/s)，与 launch 文件 max_vel 保持一致
  height_limit:  2.3       # 飞行高度限制 (m