/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/mid360"           # ← simulation publishes /mid360 (CustomMsg)
            imu_topic:  "/livox/imu"        # ← imu_frame_relay.py publishes here
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1                # AVIA path = CustomMsg from libros2_livox.so
            scan_line:  4                # Mid-360 has 4 scan lines
            blind: 0.1                   # match simulation min_range (0.1m)
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     200.0         # match simulation max_range
            extrinsic_est_en:  true
            extrinsic_T: [ 0.0, 0.0, 0.0 ]   # IMU & LiDAR co-located on mid360::link
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false
            interval: -1
